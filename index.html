<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>习惯打卡</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✅</text></svg>" />
<style>
  :root{
    --bg:#F4F6F8;
    --card:#FFFFFF;
    --text:#1F2937;
    --muted:#9CA3AF;
    --accent:#10B981;
    --accent-dark:#059669;
    --accent-soft:#D1FAE5;
    --done-bg:#EEF0F3;
    --danger:#EF4444;
    --radius:18px;
    --shadow:0 1px 2px rgba(16,24,40,.05), 0 6px 18px rgba(16,24,40,.06);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    background:var(--bg);color:var(--text);line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  .app{max-width:560px;margin:0 auto;padding:22px 16px 130px}

  /* ---------- 顶部 ---------- */
  header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;padding:4px 2px}
  .brand h1{font-size:26px;font-weight:800;letter-spacing:.5px}
  .brand .date{color:var(--muted);font-size:13px;margin-top:3px}
  .progress-wrap{display:flex;align-items:center;gap:10px}
  .progress-num{font-size:15px;font-weight:700;color:var(--muted);min-width:52px;text-align:right}
  .ring{width:58px;height:58px;transform:rotate(-90deg)}
  .ring-bg{fill:none;stroke:#E5E7EB;stroke-width:7}
  .ring-fg{fill:none;stroke:var(--accent);stroke-width:7;stroke-linecap:round;
    stroke-dasharray:163.36;stroke-dashoffset:163.36;transition:stroke-dashoffset .6s cubic-bezier(.22,1,.36,1)}

  /* ---------- 页面切换 ---------- */
  .tabs{display:flex;background:#E8EAED;border-radius:13px;padding:4px;margin-bottom:16px;gap:4px}
  .tab{
    flex:1;border:none;background:transparent;padding:10px 0;border-radius:10px;
    font-size:15px;font-weight:600;color:#6B7280;cursor:pointer;transition:all .25s ease;
    font-family:inherit;
  }
  .tab.active{background:#fff;color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.08)}
  .page{display:none}
  .page.active{display:block}

  /* ---------- 习惯卡片 ---------- */
  .habits{display:flex;flex-direction:column;gap:12px}
  .habit{
    position:relative;display:flex;align-items:center;gap:14px;
    background:var(--card);border-radius:var(--radius);padding:16px 14px;
    box-shadow:var(--shadow);border:1px solid #EDEFF2;
    transition:background .35s ease, transform .25s ease, box-shadow .35s ease, opacity .35s ease;
  }
  .habit.done{background:var(--done-bg);box-shadow:none;border-color:#E4E7EB}
  .habit.done .name{color:#A6ADB5;text-decoration:line-through}
  .habit.done .meta{color:#C0C6CD}

  .check{
    flex:none;width:46px;height:46px;border-radius:50%;
    border:2px solid #D1D5DB;background:#fff;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    transition:background .25s ease, border-color .25s ease, transform .15s ease;
  }
  .check:active{transform:scale(.88)}
  .check svg{width:24px;height:24px}
  .check .tick{fill:none;stroke:#fff;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;
    stroke-dasharray:24;stroke-dashoffset:24}
  .habit.done .check{background:var(--accent);border-color:var(--accent);animation:pop .45s cubic-bezier(.22,1,.36,1)}
  .habit.done .check .tick{animation:draw .3s .12s cubic-bezier(.22,1,.36,1) forwards}
  @keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.15)}100%{transform:scale(1)}}
  @keyframes draw{to{stroke-dashoffset:0}}

  .body{flex:1;min-width:0}
  .name-row{display:flex;align-items:center;gap:8px}
  .icon{font-size:20px;line-height:1}
  .name{font-size:16px;font-weight:600;transition:color .35s ease}
  .meta{font-size:12px;color:var(--muted);margin-top:4px;transition:color .35s ease}
  .meta .streak{color:#F59E0B;font-weight:600}

  .week{flex:none;display:flex;gap:5px;align-items:center}
  .dot{width:9px;height:9px;border-radius:50%;background:#E5E7EB;transition:background .3s ease, transform .3s ease}
  .dot.done{background:var(--accent)}
  .dot.today{box-shadow:0 0 0 2px #fff, 0 0 0 3.5px var(--accent)}
  .dot.today:not(.done){background:#fff;box-shadow:0 0 0 2px #fff, 0 0 0 3.5px #C0C6CD}

  .actions{flex:none;display:flex;flex-direction:column;gap:6px;align-items:center}
  .icon-btn{
    width:26px;height:26px;border:none;background:transparent;border-radius:8px;
    color:var(--muted);font-size:13px;cursor:pointer;display:flex;align-items:center;justify-content:center;
    transition:background .2s ease, color .2s ease;
  }
  .icon-btn:hover{background:#F3F4F6;color:var(--text)}
  .icon-btn.del:hover{background:#FEE2E2;color:var(--danger)}

  .empty{text-align:center;color:var(--muted);padding:46px 20px;font-size:14px;line-height:2}
  .empty .big{font-size:42px;display:block;margin-bottom:8px}

  /* ---------- 统计页 ---------- */
  .kpis{display:flex;gap:10px;margin-bottom:14px}
  .kpi{
    flex:1;background:#fff;border-radius:14px;padding:14px 8px;text-align:center;
    box-shadow:var(--shadow);border:1px solid #EDEFF2;
  }
  .kpi .num{font-size:26px;font-weight:800;color:var(--accent)}
  .kpi .label{font-size:12px;color:var(--muted);margin-top:2px}
  .kpi .sub{font-size:10px;color:#C0C6CD;margin-top:1px}

  .card{background:#fff;border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);border:1px solid #EDEFF2;margin-bottom:14px}
  .card h3{font-size:15px;font-weight:700;margin-bottom:4px}
  .card .hint{font-size:11px;color:#C0C6CD;margin-bottom:12px}

  .stats-table{width:100%;border-collapse:collapse;font-size:13px}
  .stats-table th{background:#F3F4F6;color:#6B7280;font-weight:600;padding:9px 6px;text-align:center;border-bottom:1px solid #E5E7EB}
  .stats-table td{padding:10px 6px;text-align:center;border-bottom:1px solid #F0F1F3}
  .stats-table td:first-child{text-align:left;font-weight:600}
  .stats-table tr:last-child td{border-bottom:none}

  .chart-grid{display:flex;flex-wrap:wrap;gap:14px}
  .chart-box{flex:1 1 100%;background:#fff;border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);border:1px solid #EDEFF2}
  .chart-box h4{font-size:14px;font-weight:700;margin-bottom:10px;display:flex;align-items:center;gap:6px}
  .chart-box h4 .tag{font-size:11px;font-weight:600;padding:2px 8px;border-radius:20px;color:#fff}
  .tag.week{background:#3B82F6}.tag.month{background:#F59E0B}.tag.year{background:#8B5CF6}
  .donut-wrap{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .donut{width:150px;height:150px;flex:none}
  .donut .slice{transition:opacity .2s ease}
  .donut .slice:hover{opacity:.85}
  .donut-total{font-size:24px;font-weight:800;fill:var(--text)}
  .donut-label{font-size:11px;fill:var(--muted)}
  .legend{flex:1;min-width:150px;display:flex;flex-direction:column;gap:8px}
  .legend-item{display:flex;align-items:center;gap:8px;font-size:12px}
  .legend-item .dot{width:10px;height:10px;border-radius:50%;flex:none}
  .legend-item .l-name{flex:1;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .legend-item .l-count{color:#6B7280}
  .legend-item .l-pct{font-weight:700;color:var(--text);min-width:46px;text-align:right}
  .chart-empty{color:var(--muted);font-size:13px;padding:26px 10px;text-align:center}

  .month-bars{display:flex;flex-direction:column;gap:7px}
  .mbar{display:flex;align-items:center;gap:8px;font-size:12px}
  .mbar .m-label{width:34px;color:#6B7280;text-align:right;flex:none}
  .mbar .m-track{flex:1;background:#F3F4F6;border-radius:6px;height:14px;overflow:hidden}
  .mbar .m-fill{height:100%;background:var(--accent);border-radius:6px;transition:width .5s ease}
  .mbar .m-count{width:30px;color:var(--text);font-weight:600;flex:none;text-align:right}

  /* ---------- 添加栏 ---------- */
  .add{
    position:fixed;left:0;right:0;bottom:0;z-index:10;
    background:linear-gradient(to top, #F4F6F8 72%, rgba(244,246,248,0));
    padding:12px 16px 26px;transition:transform .3s ease;
  }
  .add.hidden{transform:translateY(120%)}
  .add-inner{max-width:528px;margin:0 auto}
  .add-row{display:flex;gap:10px;background:#fff;border:1px solid #E5E7EB;border-radius:16px;padding:6px;box-shadow:var(--shadow)}
  .add-row input{
    flex:1;border:none;outline:none;background:transparent;font-size:15px;padding:8px 10px;color:var(--text);
  }
  .add-row button{
    border:none;background:var(--accent);color:#fff;font-size:20px;font-weight:700;
    width:46px;border-radius:12px;cursor:pointer;transition:background .2s ease, transform .15s ease;
  }
  .add-row button:active{transform:scale(.92)}
  .add-row button:hover{background:var(--accent-dark)}
  .emoji-picker{display:flex;gap:6px;overflow-x:auto;margin-top:8px;padding:2px}
  .emoji-picker::-webkit-scrollbar{display:none}
  .emoji-picker button{
    flex:none;font-size:19px;width:38px;height:38px;border-radius:12px;border:1px solid #E5E7EB;
    background:#fff;cursor:pointer;transition:background .15s ease, transform .15s ease, border-color .15s ease;
  }
  .emoji-picker button.selected{background:var(--accent-soft);border-color:var(--accent);transform:scale(1.08)}

  #confetti{position:fixed;inset:0;pointer-events:none;z-index:99}

  @media (max-width:400px){
    .week{display:none}
  }
</style>
</head>
<body>
  <div class="app">
    <header>
      <div class="brand">
        <h1>习惯打卡</h1>
        <div class="date" id="dateLabel"></div>
      </div>
      <div class="progress-wrap">
        <div class="progress-num" id="progressNum">0/0</div>
        <svg class="ring" viewBox="0 0 60 60">
          <circle class="ring-bg" cx="30" cy="30" r="26"></circle>
          <circle class="ring-fg" id="ringFg" cx="30" cy="30" r="26"></circle>
        </svg>
      </div>
    </header>

    <nav class="tabs">
      <button class="tab active" data-page="home">🏠 主页</button>
      <button class="tab" data-page="stats">📊 统计</button>
    </nav>

    <main id="pageHome" class="page active">
      <div class="habits" id="habits"></div>
    </main>

    <main id="pageStats" class="page">
      <div id="statsContent"></div>
    </main>

    <form class="add" id="addForm">
      <div class="add-inner">
        <div class="add-row">
          <input id="newName" type="text" placeholder="添加新习惯，如：冥想、阅读" maxlength="12" autocomplete="off" />
          <button type="submit" aria-label="添加">＋</button>
        </div>
        <div class="emoji-picker" id="emojiPicker"></div>
      </div>
    </form>
  </div>

  <canvas id="confetti"></canvas>

<script>
(function () {
  'use strict';
  var KEY = 'habit-tracker-v1';
  var EMOJIS = ['📖','💪','🚭','💧','🌙','📚','🧘','🏃','🥗','✍️','🎸','💊'];
  var COLORS = ['#10B981','#3B82F6','#F59E0B','#8B5CF6','#EF4444','#EC4899','#14B8A6','#F97316','#6366F1','#84CC16'];

  var habits = load();
  var selectedEmoji = '';
  var currentPage = 'home';

  /* ---------- 工具 ---------- */
  function uid() {
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  }
  function pad(n) { return String(n).padStart(2, '0'); }
  function dateStr(d) {
    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  }
  function todayStr() { return dateStr(new Date()); }
  function daysAgo(n) {
    var d = new Date();
    d.setDate(d.getDate() - n);
    return d;
  }
  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  /* ---------- 数据 ---------- */
  function defaults() {
    return [
      { name: '背单词', icon: '📖' },
      { name: '健身', icon: '💪' },
      { name: '戒烟', icon: '🚭' },
      { name: '喝水', icon: '💧' },
      { name: '早睡', icon: '🌙' }
    ].map(function (h) {
      return { id: uid(), name: h.name, icon: h.icon, history: {}, createdAt: Date.now() };
    });
  }
  function load() {
    try {
      var raw = localStorage.getItem(KEY);
      if (raw) {
        var data = JSON.parse(raw);
        if (data && Array.isArray(data.habits)) {
          return data.habits.map(function (h) {
            h.history = h.history || {};
            return h;
          });
        }
      }
    } catch (e) { /* ignore */ }
    return defaults();
  }
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify({ version: 1, habits: habits })); }
    catch (e) { /* storage full or blocked */ }
  }

  function isDone(h) { return !!h.history[todayStr()]; }
  function doneCount() {
    var t = todayStr(), n = 0;
    habits.forEach(function (h) { if (h.history[t]) n++; });
    return n;
  }
  function streak(h) {
    var n = 0, d = new Date();
    if (!h.history[dateStr(d)]) d.setDate(d.getDate() - 1);
    while (h.history[dateStr(d)]) { n++; d.setDate(d.getDate() - 1); }
    return n;
  }
  function weekDone(h) {
    var t = todayStr(), n = 0;
    for (var i = 0; i < 7; i++) { if (h.history[dateStr(daysAgo(i))]) n++; }
    return n;
  }
  function pickIcon(name) {
    var map = [
      ['单词', '📖'], ['英语', '📖'], ['背', '📖'],
      ['健身', '💪'], ['运动', '💪'], ['锻炼', '💪'],
      ['烟', '🚭'],
      ['水', '💧'],
      ['睡', '🌙'], ['早起', '🌅'],
      ['读', '📚'],
      ['冥想', '🧘'],
      ['跑', '🏃'],
      ['吃', '🥗'], ['饮食', '🥗'], ['沙拉', '🥗'],
      ['写', '✍️'], ['日记', '✍️'],
      ['琴', '🎸'], ['吉他', '🎸'],
      ['药', '💊'], ['维生素', '💊']
    ];
    for (var i = 0; i < map.length; i++) {
      if (name.indexOf(map[i][0]) !== -1) return map[i][1];
    }
    return '📌';
  }

  /* ---------- 统计计算 ---------- */
  function periodStarts() {
    var now = new Date();
    var weekStart = new Date(now);
    weekStart.setDate(now.getDate() - ((now.getDay() + 6) % 7)); // 周一为一周开始
    weekStart.setHours(0, 0, 0, 0);
    var monthStart = new Date(now.getFullYear(), now.getMonth(), 1);
    var yearStart = new Date(now.getFullYear(), 0, 1);
    return { weekStart: weekStart, monthStart: monthStart, yearStart: yearStart, now: now };
  }
  function periodCounts(h) {
    var s = periodStarts();
    var w = 0, m = 0, y = 0;
    Object.keys(h.history).forEach(function (dstr) {
      if (!h.history[dstr]) return;
      var parts = dstr.split('-');
      if (parts.length !== 3) return;
      var d = new Date(Number(parts[0]), Number(parts[1]) - 1, Number(parts[2]));
      if (isNaN(d.getTime())) return;
      if (d >= s.weekStart) w++;
      if (d >= s.monthStart) m++;
      if (d >= s.yearStart) y++;
    });
    return { w: w, m: m, y: y };
  }
  function monthTrend() {
    var year = new Date().getFullYear();
    var counts = new Array(12).fill(0);
    habits.forEach(function (h) {
      Object.keys(h.history).forEach(function (dstr) {
        if (!h.history[dstr]) return;
        var parts = dstr.split('-');
        if (parts.length !== 3) return;
        if (Number(parts[0]) === year) {
          var mm = Number(parts[1]);
          if (mm >= 1 && mm <= 12) counts[mm - 1]++;
        }
      });
    });
    return counts;
  }

  /* ---------- 渲染：主页 ---------- */
  var listEl = document.getElementById('habits');
  var dateEl = document.getElementById('dateLabel');
  var numEl = document.getElementById('progressNum');
  var ringEl = document.getElementById('ringFg');

  function render() {
    var t = todayStr();
    var sorted = habits.slice().sort(function (a, b) {
      return (!!b.history[t] - !!a.history[t]) || (a.createdAt - b.createdAt);
    });

    if (sorted.length === 0) {
      listEl.innerHTML =
        '<div class="empty"><span class="big">🌱</span>还没有习惯<br>在下方添加第一个吧！</div>';
    } else {
      listEl.innerHTML = sorted.map(function (h) {
        var done = !!h.history[t];
        var st = streak(h);
        var wd = weekDone(h);
        var dots = '';
        for (var i = 6; i >= 0; i--) {
          var d = daysAgo(i);
          var cls = h.history[dateStr(d)] ? 'dot done' : 'dot';
          if (i === 0) cls += ' today';
          dots += '<span class="' + cls + '" title="' + dateStr(d) + '"></span>';
        }
        var streakHtml = st > 0 ? '<span class="streak">🔥 ' + st + ' 天</span> · ' : '';
        return (
          '<div class="habit' + (done ? ' done' : '') + '" data-id="' + h.id + '">' +
            '<button class="check" aria-label="' + (done ? '取消完成' : '标记完成') + '">' +
              '<svg viewBox="0 0 24 24"><path class="tick" d="M5 12.5l4.6 4.6L19 7"/></svg>' +
            '</button>' +
            '<div class="body">' +
              '<div class="name-row">' +
                '<span class="icon">' + h.icon + '</span>' +
                '<span class="name">' + escapeHtml(h.name) + '</span>' +
                '<button class="icon-btn edit" aria-label="重命名">✎</button>' +
              '</div>' +
              '<div class="meta">' + streakHtml + '本周 ' + wd + '/7</div>' +
            '</div>' +
            '<div class="week">' + dots + '</div>' +
            '<div class="actions">' +
              '<button class="icon-btn del" aria-label="删除">✕</button>' +
            '</div>' +
          '</div>'
        );
      }).join('');
    }

    var total = habits.length, done = doneCount();
    numEl.textContent = done + '/' + total;
    var C = 163.36;
    ringEl.style.strokeDashoffset = total === 0 ? C : C * (1 - done / total);
  }

  /* ---------- 渲染：统计页 ---------- */
  var statsEl = document.getElementById('statsContent');

  function renderStats() {
    var rows = habits.map(function (h) {
      var pc = periodCounts(h);
      return { habit: h, w: pc.w, m: pc.m, y: pc.y };
    });
    var totals = { w: 0, m: 0, y: 0 };
    rows.forEach(function (r) { totals.w += r.w; totals.m += r.m; totals.y += r.y; });

    var html = '';

    // KPI 卡片
    html += '<div class="kpis">' +
      '<div class="kpi"><div class="num">' + totals.w + '</div><div class="label">本周完成</div><div class="sub">次数</div></div>' +
      '<div class="kpi"><div class="num">' + totals.m + '</div><div class="label">本月完成</div><div class="sub">次数</div></div>' +
      '<div class="kpi"><div class="num">' + totals.y + '</div><div class="label">今年完成</div><div class="sub">次数</div></div>' +
    '</div>';

    // 明细表
    html += '<div class="card"><h3>📋 周 / 月 / 年 次数明细</h3><div class="hint">每个习惯在对应时间段内完成的打卡次数</div>';
    if (habits.length === 0) {
      html += '<div class="chart-empty">还没有任何习惯，先去主页添加吧</div>';
    } else {
      html += '<table class="stats-table"><thead><tr><th>习惯</th><th>本周</th><th>本月</th><th>今年</th></tr></thead><tbody>' +
        rows.map(function (r) {
          return '<tr><td>' + r.habit.icon + ' ' + escapeHtml(r.habit.name) + '</td><td><strong>' + r.w + '</strong></td><td><strong>' + r.m + '</strong></td><td><strong>' + r.y + '</strong></td></tr>';
        }).join('') +
        '<tr style="background:#F9FAFB;font-weight:700"><td>合计</td><td>' + totals.w + '</td><td>' + totals.m + '</td><td>' + totals.y + '</td></tr>' +
      '</tbody></table>';
    }
    html += '</div>';

    // 三个饼图
    var charts = [
      { key: 'w', title: '本周完成分布', tag: 'week', tagText: '周' },
      { key: 'm', title: '本月完成分布', tag: 'month', tagText: '月' },
      { key: 'y', title: '今年完成分布', tag: 'year', tagText: '年' }
    ];
    html += '<div class="chart-grid">' + charts.map(function (c) {
      var items = rows.map(function (r) { return { name: r.habit.name, icon: r.habit.icon, value: r[c.key] }; })
        .filter(function (it) { return it.value > 0; });
      return '<div class="chart-box"><h4><span class="tag ' + c.tag + '">' + c.tagText + '</span>' + c.title + '</h4>' + donutHTML(items, totals[c.key], c.tagText) + '</div>';
    }).join('') + '</div>';

    // 今年每月趋势（附加）
    var trend = monthTrend();
    var maxT = Math.max.apply(null, trend.concat([1]));
    html += '<div class="card"><h3>📈 今年每月完成趋势</h3><div class="hint">全部习惯合计，按月份统计</div><div class="month-bars">';
    for (var i = 0; i < 12; i++) {
      var pct = Math.round(trend[i] / maxT * 100);
      html += '<div class="mbar"><span class="m-label">' + (i + 1) + '月</span>' +
        '<div class="m-track"><div class="m-fill" style="width:' + pct + '%"></div></div>' +
        '<span class="m-count">' + trend[i] + '</span></div>';
    }
    html += '</div></div>';

    statsEl.innerHTML = html;
  }

  function donutHTML(items, total, label) {
    if (total === 0 || items.length === 0) {
      return '<div class="chart-empty">😴 该时间段还没有完成记录</div>';
    }
    var R = 70, C = 2 * Math.PI * R;
    var offset = 0;
    var slices = '';
    items.forEach(function (it, idx) {
      var color = COLORS[idx % COLORS.length];
      var len = C * it.value / total;
      slices += '<circle class="slice" cx="90" cy="90" r="' + R + '" fill="none" stroke="' + color +
        '" stroke-width="34" stroke-dasharray="' + len.toFixed(2) + ' ' + (C - len).toFixed(2) +
        '" stroke-dashoffset="' + (-offset).toFixed(2) + '" />';
      offset += len;
    });
    var legend = items.map(function (it, idx) {
      var pct = (it.value / total * 100).toFixed(1);
      return '<div class="legend-item"><span class="dot" style="background:' + COLORS[idx % COLORS.length] + '"></span>' +
        '<span class="l-name">' + it.icon + ' ' + escapeHtml(it.name) + '</span>' +
        '<span class="l-count">' + it.value + ' 次</span>' +
        '<span class="l-pct">' + pct + '%</span></div>';
    }).join('');
    return '<div class="donut-wrap">' +
      '<svg class="donut" viewBox="0 0 180 180">' + slices +
        '<circle cx="90" cy="90" r="48" fill="#fff"/>' +
        '<text x="90" y="87" text-anchor="middle" class="donut-total">' + total + '</text>' +
        '<text x="90" y="105" text-anchor="middle" class="donut-label">' + label + '完成</text>' +
      '</svg>' +
      '<div class="legend">' + legend + '</div></div>';
  }

  /* ---------- 页面切换 ---------- */
  var tabs = document.querySelectorAll('.tab');
  var pageHome = document.getElementById('pageHome');
  var pageStats = document.getElementById('pageStats');
  var addFormEl = document.getElementById('addForm');

  function showPage(name) {
    currentPage = name;
    tabs.forEach(function (t) { t.classList.toggle('active', t.getAttribute('data-page') === name); });
    pageHome.classList.toggle('active', name === 'home');
    pageStats.classList.toggle('active', name === 'stats');
    addFormEl.classList.toggle('hidden', name !== 'home');
    if (name === 'stats') renderStats();
  }
  tabs.forEach(function (t) {
    t.addEventListener('click', function () { showPage(t.getAttribute('data-page')); });
  });

  /* ---------- 交互（事件委托） ---------- */
  listEl.addEventListener('click', function (e) {
    var card = e.target.closest('.habit');
    if (!card) return;
    var id = card.getAttribute('data-id');

    if (e.target.closest('.check')) {
      toggle(id);
      return;
    }
    if (e.target.closest('.del')) {
      removeHabit(id);
      return;
    }
    if (e.target.closest('.edit')) {
      renameHabit(id);
    }
  });

  function toggle(id) {
    var h = habits.find(function (x) { return x.id === id; });
    if (!h) return;
    var t = todayStr();
    var wasDone = !!h.history[t];
    var before = doneCount();
    if (wasDone) { delete h.history[t]; }
    else { h.history[t] = true; }
    save();
    render();
    if (!wasDone && before < habits.length && doneCount() === habits.length) {
      celebrate();
    }
  }

  function removeHabit(id) {
    var h = habits.find(function (x) { return x.id === id; });
    if (!h) return;
    if (!window.confirm('删除习惯「' + h.name + '」？（历史记录也会删除）')) return;
    habits = habits.filter(function (x) { return x.id !== id; });
    save(); render();
    if (currentPage === 'stats') renderStats();
  }

  function renameHabit(id) {
    var h = habits.find(function (x) { return x.id === id; });
    if (!h) return;
    var name = window.prompt('输入新的习惯名称：', h.name);
    if (name === null) return;
    name = name.trim().slice(0, 12);
    if (!name) return;
    h.name = name;
    save(); render();
    if (currentPage === 'stats') renderStats();
  }

  /* ---------- 添加 ---------- */
  var formEl = document.getElementById('addForm');
  var nameInput = document.getElementById('newName');
  var emojiEl = document.getElementById('emojiPicker');

  EMOJIS.forEach(function (em) {
    var b = document.createElement('button');
    b.type = 'button';
    b.textContent = em;
    b.addEventListener('click', function () {
      selectedEmoji = (selectedEmoji === em) ? '' : em;
      emojiEl.querySelectorAll('button').forEach(function (x) {
        x.classList.toggle('selected', x === b && selectedEmoji === em);
      });
    });
    emojiEl.appendChild(b);
  });

  formEl.addEventListener('submit', function (e) {
    e.preventDefault();
    var name = nameInput.value.trim().slice(0, 12);
    if (!name) { nameInput.focus(); return; }
    habits.push({
      id: uid(),
      name: name,
      icon: selectedEmoji || pickIcon(name),
      history: {},
      createdAt: Date.now()
    });
    save(); render();
    nameInput.value = '';
    selectedEmoji = '';
    emojiEl.querySelectorAll('button').forEach(function (x) { x.classList.remove('selected'); });
    nameInput.focus();
  });

  /* ---------- 撒花效果 ---------- */
  var canvas = document.getElementById('confetti');
  var ctx = canvas.getContext('2d');
  var particles = [], rafId = null;
  function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resize);
  resize();

  function celebrate() {
    var colors = ['#10B981', '#F59E0B', '#3B82F6', '#EF4444', '#8B5CF6', '#EC4899', '#FBBF24'];
    particles = [];
    for (var i = 0; i < 120; i++) {
      particles.push({
        x: Math.random() * canvas.width,
        y: -20 - Math.random() * canvas.height * 0.4,
        w: 6 + Math.random() * 6,
        h: 8 + Math.random() * 8,
        vy: 2.5 + Math.random() * 3.5,
        vx: (Math.random() - 0.5) * 2.4,
        rot: Math.random() * Math.PI,
        vr: (Math.random() - 0.5) * 0.25,
        color: colors[Math.floor(Math.random() * colors.length)]
      });
    }
    if (rafId) cancelAnimationFrame(rafId);
    (function frame() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      var alive = false;
      particles.forEach(function (p) {
        p.x += p.vx; p.y += p.vy; p.rot += p.vr;
        if (p.y < canvas.height + 30) {
          alive = true;
          ctx.save();
          ctx.translate(p.x, p.y);
          ctx.rotate(p.rot);
          ctx.fillStyle = p.color;
          ctx.globalAlpha = Math.max(0, 1 - (p.y + 30) / (canvas.height + 60));
          ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
          ctx.restore();
        }
      });
      if (alive) { rafId = requestAnimationFrame(frame); }
      else { ctx.clearRect(0, 0, canvas.width, canvas.height); rafId = null; }
    })();
  }

  /* ---------- 启动 ---------- */
  var now = new Date();
  var weekCN = ['日', '一', '二', '三', '四', '五', '六'];
  dateEl.textContent = now.getFullYear() + ' 年 ' + (now.getMonth() + 1) + ' 月 ' + now.getDate() + ' 日 · 周' + weekCN[now.getDay()];
  render();
})();
</script>
</body>
</html>
