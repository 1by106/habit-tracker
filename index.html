<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>习惯打卡</title>
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#10B981" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="习惯打卡" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<script>
(function(){try{var d=JSON.parse(localStorage.getItem('habit-tracker-v1'));var t=(d&&d.theme)||{mode:'system',accent:'green'};var dark=(typeof matchMedia!=='undefined'&&matchMedia('(prefers-color-scheme: dark)').matches);var m=t.mode==='dark'?'dark':(t.mode==='light'?'light':(dark?'dark':'light'));document.documentElement.setAttribute('data-theme',m);document.documentElement.setAttribute('data-accent',t.accent||'green');}catch(e){}}());
</script>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏆</text></svg>" />
<style>
  :root{
    --bg:#F4F6F8;
    --card:#FFFFFF;
    --text:#1F2937;
    --muted:#9CA3AF;
    --accent:#10B981;
    --accent-dark:#059669;
    --accent-soft:#D1FAE5;
    --done-bg:#EEF0F3;
    --danger:#EF4444;
    --radius:18px;
    --shadow:0 1px 2px rgba(16,24,40,.05), 0 6px 18px rgba(16,24,40,.06);
  }
  /* ---------- 主题系统 ---------- */
  :root{
    --border:#EDEFF2;
    --border-strong:#E5E7EB;
    --border-light:#F0F1F3;
    --fill-weak:#F3F4F6;
    --fill-mid:#E8EAED;
    --fill-soft:#F9FAFB;
    --ring-bg:#E5E7EB;
    --check-border:#D1D5DB;
    --switch-off:#D1D5DB;
    --donut-hole:#FFFFFF;
    --muted-strong:#6B7280;
    --add-fade:rgba(244,246,248,0);
  }
  [data-theme="dark"]{
    --bg:#111827;
    --card:#1F2937;
    --text:#F3F4F6;
    --muted:#9CA3AF;
    --muted-strong:#D1D5DB;
    --accent:#34D399;
    --accent-dark:#10B981;
    --done-bg:#1A2536;
    --border:#374151;
    --border-strong:#4B5563;
    --border-light:#374151;
    --fill-weak:#374151;
    --fill-mid:#374151;
    --fill-soft:#2A3548;
    --ring-bg:#374151;
    --check-border:#4B5563;
    --switch-off:#4B5563;
    --donut-hole:#1F2937;
    --add-fade:rgba(17,24,39,0);
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 6px 18px rgba(0,0,0,.4);
  }
  [data-accent="blue"]{--accent:#3B82F6;--accent-dark:#2563EB;--accent-soft:#DBEAFE}
  [data-accent="purple"]{--accent:#8B5CF6;--accent-dark:#7C3AED;--accent-soft:#EDE9FE}
  [data-accent="orange"]{--accent:#F59E0B;--accent-dark:#D97706;--accent-soft:#FEF3C7}
  [data-accent="pink"]{--accent:#EC4899;--accent-dark:#DB2777;--accent-soft:#FCE7F3}
  [data-accent="cyan"]{--accent:#06B6D4;--accent-dark:#0891B2;--accent-soft:#CFFAFE}
  [data-theme="dark"][data-accent="blue"]{--accent-soft:#1E3A5F}
  [data-theme="dark"][data-accent="purple"]{--accent-soft:#3B2F63}
  [data-theme="dark"][data-accent="orange"]{--accent-soft:#4A3208}
  [data-theme="dark"][data-accent="pink"]{--accent-soft:#4A1D36}
  [data-theme="dark"][data-accent="cyan"]{--accent-soft:#0B3A44}
  [data-theme="dark"][data-accent="green"]{--accent-soft:#064E3B}

  [data-theme="dark"] .ring-bg{stroke:var(--ring-bg)}
  [data-theme="dark"] .tabs{background:var(--fill-mid)}
  [data-theme="dark"] .tab{color:var(--muted-strong)}
  [data-theme="dark"] .tab.active{background:var(--card);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.4)}
  [data-theme="dark"] .habit{border-color:var(--border)}
  [data-theme="dark"] .habit.done{border-color:var(--border)}
  [data-theme="dark"] .check{border-color:var(--check-border);background:var(--card)}
  [data-theme="dark"] .dot{background:var(--ring-bg)}
  [data-theme="dark"] .icon-btn:hover{background:var(--fill-weak);color:var(--text)}
  [data-theme="dark"] .kpi{background:var(--card);border-color:var(--border)}
  [data-theme="dark"] .card{background:var(--card);border-color:var(--border)}
  [data-theme="dark"] .chart-box{background:var(--card);border-color:var(--border)}
  [data-theme="dark"] .stats-table th{background:var(--fill-weak);color:var(--muted-strong)}
  [data-theme="dark"] .stats-table td{border-color:var(--border-light)}
  [data-theme="dark"] .stats-table tr.total-row td{background:var(--fill-weak)}
  [data-theme="dark"] .donut .donut-hole{fill:var(--donut-hole)}
  [data-theme="dark"] .mbar .m-track{background:var(--fill-weak)}
  [data-theme="dark"] .trophy{border-color:var(--border)}
  [data-theme="dark"] .trophy.locked{background:var(--fill-weak)}
  [data-theme="dark"] .trophy .t-progress{background:var(--fill-weak)}
  [data-theme="dark"] .add{background:linear-gradient(to top, var(--bg) 72%, var(--add-fade))}
  [data-theme="dark"] .add-card{background:var(--card);border-color:var(--border-strong)}
  [data-theme="dark"] .add-row .emoji-btn{background:var(--fill-soft);border-color:var(--border-strong)}
  [data-theme="dark"] .add-row input{color:var(--text)}
  [data-theme="dark"] .emoji-grid{border-top-color:var(--border-light)}
  [data-theme="dark"] .emoji-grid .eg-grid button:hover{background:var(--fill-weak)}
  [data-theme="dark"] .add-preview{border-top-color:var(--border-strong)}
  [data-theme="dark"] .pv-habit{background:var(--fill-soft);border-color:var(--border)}
  [data-theme="dark"] .pv-icon{background:var(--card);border-color:var(--border-strong)}
  [data-theme="dark"] .modal{background:var(--card)}
  [data-theme="dark"] .m-btn.ghost{background:var(--fill-weak);color:var(--muted-strong)}
  [data-theme="dark"] .edit-row input{background:var(--card);border-color:var(--border-strong);color:var(--text)}
  [data-theme="dark"] .remind-row{border-color:var(--border-light)}
  [data-theme="dark"] .remind-row input[type=time]{background:var(--card);border-color:var(--border-strong);color:var(--text)}
  [data-theme="dark"] .slider{background:var(--switch-off)}
  [data-theme="dark"] .bell{background:var(--card);border-color:var(--border-strong)}
  [data-theme="dark"] .install-tip{background:#022C22;border-color:#064E3B;color:#6EE7B7}

  .stats-table tr.total-row td{background:var(--fill-weak);font-weight:700}
  .donut .donut-hole{fill:var(--donut-hole)}

  .theme-btn{flex:none;width:46px;height:46px;border-radius:50%;border:1px solid #E5E7EB;background:#fff;font-size:19px;cursor:pointer;transition:transform .15s ease, background .2s ease}
  .theme-btn:hover{background:#F3F4F6}
  .theme-btn:active{transform:scale(.92)}
  [data-theme="dark"] .theme-btn{background:var(--card);border-color:var(--border-strong)}
  [data-theme="dark"] .theme-btn:hover{background:var(--fill-weak)}
  .theme-group{margin-top:14px}
  .theme-label{font-size:12px;color:var(--muted);margin-bottom:8px}
  .mode-row{display:flex;gap:8px}
  .mode-btn{flex:1;border:1px solid var(--border-strong);background:var(--fill-soft);color:var(--text);border-radius:10px;padding:9px 0;font-size:13px;cursor:pointer;font-family:inherit;transition:all .2s ease}
  .mode-btn.active{border-color:var(--accent);background:var(--accent-soft);font-weight:700}
  .accent-row{display:flex;gap:12px;flex-wrap:wrap}
  .swatch{width:34px;height:34px;border-radius:50%;border:3px solid transparent;cursor:pointer;transition:transform .15s ease, border-color .2s ease;flex:none}
  .swatch:hover{transform:scale(1.12)}
  .swatch.active{border-color:var(--text)}

  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    background:var(--bg);color:var(--text);line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  .app{max-width:560px;margin:0 auto;padding:22px 16px 150px}

  /* ---------- 顶部 ---------- */
  header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;padding:4px 2px}
  .brand h1{font-size:26px;font-weight:800;letter-spacing:.5px}
  .brand .date{color:var(--muted);font-size:13px;margin-top:3px}
  .progress-wrap{display:flex;align-items:center;gap:10px}
  .progress-num{font-size:15px;font-weight:700;color:var(--muted);min-width:52px;text-align:right}
  .ring{width:58px;height:58px;transform:rotate(-90deg)}
  .ring-bg{fill:none;stroke:#E5E7EB;stroke-width:7}
  .ring-fg{fill:none;stroke:var(--accent);stroke-width:7;stroke-linecap:round;
    stroke-dasharray:163.36;stroke-dashoffset:163.36;transition:stroke-dashoffset .6s cubic-bezier(.22,1,.36,1)}

  /* ---------- 语录横幅 ---------- */
  .quote{
    background:linear-gradient(135deg,#0F766E,#10B981);
    color:#fff;border-radius:var(--radius);padding:14px 16px;margin-bottom:14px;
    box-shadow:var(--shadow);position:relative;overflow:hidden;
  }
  .quote .q-text{font-size:14px;font-weight:600;line-height:1.7}
  .quote .q-meta{font-size:11px;opacity:.85;margin-top:6px;display:flex;justify-content:space-between}
  .quote::after{content:"“";position:absolute;right:10px;top:-22px;font-size:90px;opacity:.15;font-family:Georgia,serif}

  /* ---------- 页面切换 ---------- */
  .tabs{display:flex;background:#E8EAED;border-radius:13px;padding:4px;margin-bottom:16px;gap:4px}
  .tab{
    flex:1;border:none;background:transparent;padding:10px 0;border-radius:10px;
    font-size:15px;font-weight:600;color:#6B7280;cursor:pointer;transition:all .25s ease;
    font-family:inherit;white-space:nowrap;
  }
  .tab.active{background:#fff;color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.08)}
  .page{display:none}
  .page.active{display:block}

  /* ---------- 习惯卡片 ---------- */
  .habits{display:flex;flex-direction:column;gap:12px}
  .habit{
    position:relative;display:flex;align-items:center;gap:14px;
    background:var(--card);border-radius:var(--radius);padding:16px 14px;
    box-shadow:var(--shadow);border:1px solid #EDEFF2;
    transition:background .35s ease, transform .25s ease, box-shadow .35s ease, opacity .35s ease;
  }
  .habit.done{background:var(--done-bg);box-shadow:none;border-color:#E4E7EB}
  .habit.done .name{color:#A6ADB5;text-decoration:line-through}
  .habit.done .meta{color:#C0C6CD}

  .check{
    flex:none;width:46px;height:46px;border-radius:50%;
    border:2px solid #D1D5DB;background:#fff;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    transition:background .25s ease, border-color .25s ease, transform .15s ease;
  }
  .check:active{transform:scale(.88)}
  .check svg{width:24px;height:24px}
  .check .tick{fill:none;stroke:#fff;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;
    stroke-dasharray:24;stroke-dashoffset:24}
  .habit.done .check{background:var(--accent);border-color:var(--accent);animation:pop .45s cubic-bezier(.22,1,.36,1)}
  .habit.done .check .tick{animation:draw .3s .12s cubic-bezier(.22,1,.36,1) forwards}
  @keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.15)}100%{transform:scale(1)}}
  @keyframes draw{to{stroke-dashoffset:0}}

  .body{flex:1;min-width:0}
  .name-row{display:flex;align-items:center;gap:8px}
  .icon{font-size:20px;line-height:1}
  .name{font-size:16px;font-weight:600;transition:color .35s ease}
  .meta{font-size:12px;color:var(--muted);margin-top:4px;transition:color .35s ease}
  .meta .streak{color:#F59E0B;font-weight:600}

  .week{flex:none;display:flex;gap:5px;align-items:center}
  .dot{width:9px;height:9px;border-radius:50%;background:#E5E7EB;transition:background .3s ease, transform .3s ease}
  .dot.done{background:var(--accent)}
  .dot.today{box-shadow:0 0 0 2px #fff, 0 0 0 3.5px var(--accent)}
  .dot.today:not(.done){background:#fff;box-shadow:0 0 0 2px #fff, 0 0 0 3.5px #C0C6CD}

  .actions{flex:none;display:flex;flex-direction:column;gap:6px;align-items:center}
  .icon-btn{
    width:26px;height:26px;border:none;background:transparent;border-radius:8px;
    color:var(--muted);font-size:13px;cursor:pointer;display:flex;align-items:center;justify-content:center;
    transition:background .2s ease, color .2s ease;
  }
  .icon-btn:hover{background:#F3F4F6;color:var(--text)}
  .icon-btn.del:hover{background:#FEE2E2;color:var(--danger)}

  .empty{text-align:center;color:var(--muted);padding:46px 20px;font-size:14px;line-height:2}
  .empty .big{font-size:42px;display:block;margin-bottom:8px}

  /* ---------- 统计页 ---------- */
  .kpis{display:flex;gap:10px;margin-bottom:14px}
  .kpi{
    flex:1;background:#fff;border-radius:14px;padding:14px 8px;text-align:center;
    box-shadow:var(--shadow);border:1px solid #EDEFF2;
  }
  .kpi .num{font-size:26px;font-weight:800;color:var(--accent)}
  .kpi .label{font-size:12px;color:var(--muted);margin-top:2px}
  .kpi .sub{font-size:10px;color:#C0C6CD;margin-top:1px}

  .card{background:#fff;border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);border:1px solid #EDEFF2;margin-bottom:14px}
  .card h3{font-size:15px;font-weight:700;margin-bottom:4px}
  .card .hint{font-size:11px;color:#C0C6CD;margin-bottom:12px}

  .stats-table{width:100%;border-collapse:collapse;font-size:13px}
  .stats-table th{background:#F3F4F6;color:#6B7280;font-weight:600;padding:9px 6px;text-align:center;border-bottom:1px solid #E5E7EB}
  .stats-table td{padding:10px 6px;text-align:center;border-bottom:1px solid #F0F1F3}
  .stats-table td:first-child{text-align:left;font-weight:600}
  .stats-table tr:last-child td{border-bottom:none}

  .chart-grid{display:flex;flex-wrap:wrap;gap:14px}
  .chart-box{flex:1 1 100%;background:#fff;border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);border:1px solid #EDEFF2}
  .chart-box h4{font-size:14px;font-weight:700;margin-bottom:10px;display:flex;align-items:center;gap:6px}
  .chart-box h4 .tag{font-size:11px;font-weight:600;padding:2px 8px;border-radius:20px;color:#fff}
  .tag.week{background:#3B82F6}.tag.month{background:#F59E0B}.tag.year{background:#8B5CF6}
  .donut-wrap{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .donut{width:150px;height:150px;flex:none}
  .donut .slice{transition:opacity .2s ease}
  .donut .slice:hover{opacity:.85}
  .donut-total{font-size:24px;font-weight:800;fill:var(--text)}
  .donut-label{font-size:11px;fill:var(--muted)}
  .legend{flex:1;min-width:150px;display:flex;flex-direction:column;gap:8px}
  .legend-item{display:flex;align-items:center;gap:8px;font-size:12px}
  .legend-item .dot{width:10px;height:10px;border-radius:50%;flex:none}
  .legend-item .l-name{flex:1;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .legend-item .l-count{color:#6B7280}
  .legend-item .l-pct{font-weight:700;color:var(--text);min-width:46px;text-align:right}
  .chart-empty{color:var(--muted);font-size:13px;padding:26px 10px;text-align:center}

  .month-bars{display:flex;flex-direction:column;gap:7px}
  .mbar{display:flex;align-items:center;gap:8px;font-size:12px}
  .mbar .m-label{width:34px;color:#6B7280;text-align:right;flex:none}
  .mbar .m-track{flex:1;background:#F3F4F6;border-radius:6px;height:14px;overflow:hidden}
  .mbar .m-fill{height:100%;background:var(--accent);border-radius:6px;transition:width .5s ease}
  .mbar .m-count{width:30px;color:var(--text);font-weight:600;flex:none;text-align:right}

  /* ---------- 成就页 ---------- */
  .trophy-shelf{display:flex;flex-direction:column;gap:12px}
  .trophy{
    display:flex;align-items:center;gap:14px;border-radius:14px;padding:14px;
    border:1px solid #EDEFF2;background:#fff;transition:all .3s ease;
  }
  .trophy.locked{background:#F7F8FA;opacity:.75}
  .trophy .t-icon{font-size:40px;flex:none;filter:grayscale(1);opacity:.4;transition:all .4s ease}
  .trophy.unlocked .t-icon{filter:none;opacity:1;animation:trophyPop .5s cubic-bezier(.22,1,.36,1)}
  @keyframes trophyPop{0%{transform:scale(.3) rotate(-15deg)}60%{transform:scale(1.2) rotate(5deg)}100%{transform:scale(1)}}
  .trophy .t-info{flex:1;min-width:0}
  .trophy .t-days{font-size:16px;font-weight:800}
  .trophy .t-desc{font-size:11px;color:var(--muted);margin-top:2px}
  .trophy .t-status{font-size:11px;font-weight:700;margin-top:6px}
  .trophy.unlocked .t-status{color:var(--accent)}
  .trophy.locked .t-status{color:#C0C6CD}
  .trophy .t-progress{height:6px;background:#F3F4F6;border-radius:4px;margin-top:6px;overflow:hidden}
  .trophy .t-progress .fill{height:100%;background:var(--accent);border-radius:4px;transition:width .6s ease}
  .trophy .t-badge{flex:none;font-size:22px}

  .best-list{display:flex;flex-direction:column;gap:10px}
  .best-item{display:flex;align-items:center;gap:12px;font-size:13px}
  .best-item .b-icon{font-size:20px}
  .best-item .b-name{flex:1;font-weight:600}
  .best-item .b-streak{color:#F59E0B;font-weight:800}

  /* ---------- 添加栏 ---------- */
  .add{
    position:fixed;left:0;right:0;bottom:0;z-index:10;
    background:linear-gradient(to top, #F4F6F8 72%, rgba(244,246,248,0));
    padding:12px 16px 24px;transition:transform .3s ease;
  }
  .add.hidden{transform:translateY(130%)}
  .add-inner{max-width:528px;margin:0 auto}
  .add-card{background:#fff;border:1px solid #E5E7EB;border-radius:18px;padding:10px;box-shadow:var(--shadow)}
  .add-row{display:flex;gap:10px;align-items:center}
  .add-row .emoji-btn{
    flex:none;width:44px;height:44px;border-radius:13px;border:1px solid #E5E7EB;background:#F9FAFB;
    font-size:20px;cursor:pointer;transition:all .2s ease;display:flex;align-items:center;justify-content:center;
  }
  .add-row .emoji-btn:hover{border-color:var(--accent);background:var(--accent-soft)}
  .add-row input[type=text]{
    flex:1;border:none;outline:none;background:transparent;font-size:15px;padding:4px 2px;color:var(--text);min-width:0;
  }
  .add-row .add-btn{
    flex:none;border:none;cursor:pointer;font-family:inherit;
    background:linear-gradient(135deg,#10B981,#059669);color:#fff;
    font-size:14px;font-weight:700;padding:0 18px;height:44px;border-radius:13px;
    display:flex;align-items:center;gap:6px;
    box-shadow:0 4px 12px rgba(16,185,129,.35);
    transition:transform .15s ease, box-shadow .2s ease;
  }
  .add-row .add-btn:hover{transform:translateY(-1px);box-shadow:0 6px 16px rgba(16,185,129,.45)}
  .add-row .add-btn:active{transform:scale(.96)}
  .add-row .add-btn .plus{font-size:17px;font-weight:800;line-height:1}

  /* 表情网格 */
  .emoji-grid{
    display:none;max-height:168px;overflow-y:auto;margin-top:10px;padding-top:10px;
    border-top:1px solid #F0F1F3;
  }
  .emoji-grid.open{display:block}
  .emoji-grid .eg-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:4px}
  .emoji-grid .eg-grid button{
    aspect-ratio:1;border:none;background:transparent;border-radius:9px;font-size:20px;cursor:pointer;
    transition:background .15s ease, transform .15s ease;display:flex;align-items:center;justify-content:center;
  }
  .emoji-grid .eg-grid button:hover{background:#F3F4F6;transform:scale(1.15)}
  .emoji-grid .eg-grid button.selected{background:var(--accent-soft)}

  /* 添加预览 */
  .add-preview{margin-top:10px;border-top:1px dashed #E5E7EB;padding-top:10px}
  .add-preview .pv-label{font-size:11px;color:var(--muted);margin-bottom:6px}
  .pv-habit{
    display:flex;align-items:center;gap:12px;background:#F9FAFB;border-radius:12px;padding:10px 12px;
    border:1px solid #EDEFF2;
  }
  .pv-habit .pv-icon{font-size:22px;width:40px;height:40px;border-radius:50%;background:#fff;border:1px solid #E5E7EB;display:flex;align-items:center;justify-content:center;flex:none}
  .pv-habit .pv-name{font-size:14px;font-weight:600;color:var(--muted)}

  /* ---------- 工具 ---------- */
  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
  function pad(n) { return String(n).padStart(2, '0'); }
  function dateStr(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function todayStr() { return dateStr(new Date()); }
  function daysAgo(n) { var d = new Date(); d.setDate(d.getDate() - n); return d; }
  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function dayNum(k) { var p = k.split('-').map(Number); return Date.UTC(p[0], p[1] - 1, p[2]) / 86400000; }

  /* ---------- 数据 ---------- */
  function defaults() {
    return [
      { name: '背单词', icon: '📖' },
      { name: '健身', icon: '💪' },
      { name: '戒烟', icon: '🚭' },
      { name: '喝水', icon: '💧' },
      { name: '早睡', icon: '🌙' }
    ].map(function (h) {
      return { id: uid(), name: h.name, icon: h.icon, history: {}, createdAt: Date.now() };
    });
  }
  function load() {
    try {
      var raw = localStorage.getItem(KEY);
      if (raw) {
        var data = JSON.parse(raw);
        if (data && Array.isArray(data.habits)) {
          var h = data.habits.map(function (x) { x.history = x.history || {}; return x; });
          h.unlocks = data.unlocks || {};
          h.reminder = data.reminder || { enabled: false, time: '20:00' };
          h.theme = data.theme || { mode: 'system', accent: 'green' };
          return h;
        }
      }
    } catch (e) { /* ignore */ }
    var d = defaults();
    d.unlocks = {};
    d.reminder = { enabled: false, time: '20:00' };
    d.theme = { mode: 'system', accent: 'green' };
    return d;
  }
  function save() {
    var data = { version: 1, habits: habits, unlocks: habits.unlocks, reminder: habits.reminder, theme: habits.theme };
    try { localStorage.setItem(KEY, JSON.stringify(data)); } catch (e) { /* ignore */ }
  }

  function isDone(h) { return !!h.history[todayStr()]; }
  function doneCount() {
    var t = todayStr(), n = 0;
    habits.forEach(function (h) { if (h.history[t]) n++; });
    return n;
  }
  function currentStreak(h) {
    var n = 0, d = new Date();
    if (!h.history[dateStr(d)]) d.setDate(d.getDate() - 1);
    while (h.history[dateStr(d)]) { n++; d.setDate(d.getDate() - 1); }
    return n;
  }
  function longestStreak(h) {
    var days = [];
    Object.keys(h.history).forEach(function (k) { if (h.history[k]) days.push(k); });
    days.sort(function (a, b) { return dayNum(a) - dayNum(b); });
    var best = { length: 0, end: null }, run = 0;
    for (var i = 0; i < days.length; i++) {
      if (i > 0 && dayNum(days[i]) - dayNum(days[i - 1]) === 1) run++;
      else run = 1;
      if (run > best.length) { best.length = run; best.end = days[i]; }
    }
    return best;
  }
  function weekDone(h) {
    var t = todayStr(), n = 0;
    for (var i = 0; i < 7; i++) { if (h.history[dateStr(daysAgo(i))]) n++; }
    return n;
  }
  function overallStreak() {
    if (habits.length === 0) return { length: 0, end: null };
    var cand = null;
    habits.forEach(function (h) {
      var s = new Set();
      Object.keys(h.history).forEach(function (k) { if (h.history[k]) s.add(k); });
      if (cand === null) cand = s;
      else cand = new Set(Array.from(cand).filter(function (k) { return s.has(k); }));
    });
    var days = Array.from(cand || []).sort(function (a, b) { return dayNum(a) - dayNum(b); });
    var best = { length: 0, end: null }, run = 0;
    for (var i = 0; i < days.length; i++) {
      if (i > 0 && dayNum(days[i]) - dayNum(days[i - 1]) === 1) run++;
      else run = 1;
      if (run > best.length) { best.length = run; best.end = days[i]; }
    }
    return best;
  }

    return QUOTES[doy % QUOTES.length];
  }

  /* ---------- 渲染：主页 ---------- */

  function render() {

    var total = habits.length, done = doneCount();
    numEl.textContent = done + '/' + total;

  /* ---------- 渲染：统计页 ---------- */

  function renderStats() {

    var html = '<div class="kpis">' +
      '<div class="kpi"><div class="num">' + totals.w + '</div><div class="label">本周完成</div><div class="sub">次数</div></div>' +
      '<div class="kpi"><div class="num">' + totals.m + '</div><div class="label">本月完成</div><div class="sub">次数</div></div>' +
      '<div class="kpi"><div class="num">' + totals.y + '</div><div class="label">今年完成</div><div class="sub">次数</div></div>' +
    '</div>';

    html += '<div class="card"><h3>📋 周 / 月 / 年 次数明细</h3><div class="hint">每个习惯在对应时间段内完成的打卡次数</div>';
    if (habits.length === 0) {
      html += '<div class="chart-empty">还没有任何习惯，先去主页添加吧</div>';
    } else {
      html += '<table class="stats-table"><thead><tr><th>习惯</th><th>本周</th><th>本月</th><th>今年</th></tr></thead><tbody>' +
        rows.map(function (r) {
          return '<tr><td>' + r.habit.icon + ' ' + escapeHtml(r.habit.name) + '</td><td><strong>' + r.w + '</strong></td><td><strong>' + r.m + '</strong></td><td><strong>' + r.y + '</strong></td></tr>';
        }).join('') +
        '<tr class="total-row"><td>合计</td><td>' + totals.w + '</td><td>' + totals.m + '</td><td>' + totals.y + '</td></tr>' +
      '</tbody></table>';
    }
    html += '</div>';

    var charts = [
      { key: 'w', title: '本周完成分布', tag: 'week', tagText: '周' },
      { key: 'm', title: '本月完成分布', tag: 'month', tagText: '月' },
      { key: 'y', title: '今年完成分布', tag: 'year', tagText: '年' }
    ];
    html += '<div class="chart-grid">' + charts.map(function (c) {
      var items = rows.map(function (r) { return { name: r.habit.name, icon: r.habit.icon, value: r[c.key] }; })
        .filter(function (it) { return it.value > 0; });
      return '<div class="chart-box"><h4><span class="tag ' + c.tag + '">' + c.tagText + '</span>' + c.title + '</h4>' + donutHTML(items, totals[c.key], c.tagText) + '</div>';
    }).join('') + '</div>';

    var trend = monthTrend();
    var maxT = Math.max.apply(null, trend.concat([1]));
    html += '<div class="card"><h3>📈 今年每月完成趋势</h3><div class="hint">全部习惯合计，按月份统计</div><div class="month-bars">';
    for (var i = 0; i < 12; i++) {
      var pct = Math.round(trend[i] / maxT * 100);
      html += '<div class="mbar"><span class="m-label">' + (i + 1) + '月</span>' +
        '<div class="m-track"><div class="m-fill" style="width:' + pct + '%"></div></div>' +
        '<span class="m-count">' + trend[i] + '</span></div>';
    }
    html += '</div></div>';

    statsEl.innerHTML = html;
  }

  function periodCounts(h) {
    var now = new Date();
    var ws = new Date(now); ws.setDate(now.getDate() - ((now.getDay() + 6) % 7)); ws.setHours(0, 0, 0, 0);
    var ms = new Date(now.getFullYear(), now.getMonth(), 1);
    var ys = new Date(now.getFullYear(), 0, 1);
    var w = 0, m = 0, y = 0;
    Object.keys(h.history).forEach(function (dstr) {
      if (!h.history[dstr]) return;
      var p = dstr.split('-');
      if (p.length !== 3) return;
      var d = new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2]));
      if (isNaN(d.getTime())) return;
      if (d >= ws) w++;
      if (d >= ms) m++;
      if (d >= ys) y++;
    });
    return { w: w, m: m, y: y };
  }
  function monthTrend() {
    var year = new Date().getFullYear();
    var counts = new Array(12).fill(0);
    habits.forEach(function (h) {
      Object.keys(h.history).forEach(function (dstr) {
        if (!h.history[dstr]) return;
        var p = dstr.split('-');
        if (p.length !== 3) return;
        if (Number(p[0]) === year) {
          var mm = Number(p[1]);
          if (mm >= 1 && mm <= 12) counts[mm - 1]++;
        }
      });
    });
    return counts;
  }
  function donutHTML(items, total, label) {
    if (total === 0 || items.length === 0) return '<div class="chart-empty">😴 该时间段还没有完成记录</div>';
    var R = 70, C = 2 * Math.PI * R;
    var offset = 0, slices = '';
    items.forEach(function (it, idx) {
      var color = COLORS[idx % COLORS.length];
      var len = C * it.value / total;
      slices += '<circle class="slice" cx="90" cy="90" r="' + R + '" fill="none" stroke="' + color +
        '" stroke-width="34" stroke-dasharray="' + len.toFixed(2) + ' ' + (C - len).toFixed(2) +
        '" stroke-dashoffset="' + (-offset).toFixed(2) + '" />';
      offset += len;
    });
    var legend = items.map(function (it, idx) {
      var pct = (it.value / total * 100).toFixed(1);
      return '<div class="legend-item"><span class="dot" style="background:' + COLORS[idx % COLORS.length] + '"></span>' +
        '<span class="l-name">' + it.icon + ' ' + escapeHtml(it.name) + '</span>' +
        '<span class="l-count">' + it.value + ' 次</span>' +
        '<span class="l-pct">' + pct + '%</span></div>';
    }).join('');
    return '<div class="donut-wrap">' +
      '<svg class="donut" viewBox="0 0 180 180">' + slices +
        '<circle class="donut-hole" cx="90" cy="90" r="48"/>' +
        '<text x="90" y="87" text-anchor="middle" class="donut-total">' + total + '</text>' +
        '<text x="90" y="105" text-anchor="middle" class="donut-label">' + label + '完成</text>' +
      '</svg><div class="legend">' + legend + '</div></div>';
  }

  /* ---------- 渲染：成就页 ---------- */
  var achEl = document.getElementById('achContent');

  function renderAchievements() {
    var os = overallStreak();
    var bestHabit = null;
    habits.forEach(function (h) {
      var ls = longestStreak(h).length;
      if (!bestHabit || ls > bestHabit.len) bestHabit = { habit: h, len: ls };
    });

    // 计算每个里程碑是否解锁
    var derived = {};
    MILESTONES.forEach(function (ms) {
      var achivers = habits.filter(function (h) { return longestStreak(h).length >= ms.days; });
      derived[ms.days] = achivers.map(function (h) { return h.id; });
    });

    // 检测新解锁
    var newUnlocks = [];
    MILESTONES.forEach(function (ms) {
      if (derived[ms.days].length > 0 && !habits.unlocks[ms.days]) {
        newUnlocks.push(ms);
        habits.unlocks[ms.days] = { date: todayStr(), habits: derived[ms.days] };
      }
    });
    if (newUnlocks.length > 0) save();

    var unlockedCount = MILESTONES.filter(function (ms) { return derived[ms.days].length > 0; }).length;

    var html = '<div class="kpis">' +
      '<div class="kpi"><div class="num">' + os.length + '</div><div class="label">全勤最长</div><div class="sub">天</div></div>' +
      '<div class="kpi"><div class="num">' + (bestHabit ? bestHabit.len : 0) + '</div><div class="label">最佳习惯</div><div class="sub">' + (bestHabit ? escapeHtml(bestHabit.habit.name) : '—') + '</div></div>' +
      '<div class="kpi"><div class="num">' + unlockedCount + '/' + MILESTONES.length + '</div><div class="label">已解锁奖杯</div><div class="sub">个</div></div>' +
    '</div>';

    // 奖杯里程碑
    html += '<div class="card"><h3>🏆 坚持奖杯</h3><div class="hint">同一个习惯连续打卡达到天数，自动解锁奖杯</div><div class="trophy-shelf">';
    MILESTONES.forEach(function (ms) {
      var achivers = derived[ms.days];
      var unlocked = achivers.length > 0;
      var maxLen = habits.reduce(function (mx, h) { return Math.max(mx, longestStreak(h).length); }, 0);
      var pct = Math.min(100, Math.round(maxLen / ms.days * 100));
      var names = achivers.slice(0, 2).map(function (id) {
        var h = habits.find(function (x) { return x.id === id; });
        return h ? h.icon + h.name : '';
      }).join('、');
      var unlockDate = habits.unlocks[ms.days] ? habits.unlocks[ms.days].date : null;
      html += '<div class="trophy ' + (unlocked ? 'unlocked' : 'locked') + '">' +
        '<div class="t-icon">' + ms.icon + '</div>' +
        '<div class="t-info">' +
          '<div class="t-days">' + ms.days + ' 天 · ' + ms.name + '</div>' +
          '<div class="t-desc">同一习惯连续打卡 ' + ms.days + ' 天</div>' +
          '<div class="t-progress"><div class="fill" style="width:' + pct + '%"></div></div>' +
          '<div class="t-status">' + (unlocked
            ? '✅ 已解锁' + (unlockDate ? '（' + unlockDate + '）' : '') + (names ? ' · ' + names : '')
            : '🔒 未解锁 · 当前最长 ' + maxLen + '/' + ms.days + ' 天') + '</div>' +
        '</div>' +
        '<div class="t-badge">' + (unlocked ? '🏆' : '🔒') + '</div>' +
      '</div>';
    });
    html += '</div></div>';

    // 各习惯最佳记录
    html += '<div class="card"><h3>📊 各习惯最佳记录</h3><div class="hint">每个习惯的历史最长连续打卡</div>';
    if (habits.length === 0) {
      html += '<div class="chart-empty">还没有习惯，去主页添加吧</div>';
    } else {
      html += '<div class="best-list">' + habits.slice().sort(function (a, b) { return longestStreak(b).length - longestStreak(a).length; })
        .map(function (h) {
          var ls = longestStreak(h);
          var cs = currentStreak(h);
          return '<div class="best-item"><span class="b-icon">' + h.icon + '</span>' +
            '<span class="b-name">' + escapeHtml(h.name) + '</span>' +
            '<span class="b-streak">最长 ' + ls.length + ' 天</span>' +
            '<span style="color:var(--muted);font-size:12px">' + (cs > 0 ? '🔥当前 ' + cs + ' 天' : '') + '</span></div>';
        }).join('') + '</div>';
    }
    html += '</div>';

    achEl.innerHTML = html;
    if (newUnlocks.length > 0) showTrophyModal(newUnlocks);
  }

  /* ---------- 交互（事件委托） ---------- */
  listEl.addEventListener('click', function (e) {
    var card = e.target.closest('.habit');
    if (!card) return;
    var id = card.getAttribute('data-id');
    if (e.target.closest('.check')) { toggle(id); return; }
    if (e.target.closest('.del')) { removeHabit(id); return; }
    if (e.target.closest('.edit')) { openEdit(id); }

  function toggle(id) {
    var h = habits.find(function (x) { return x.id === id; });
    if (!h) return;
    var t = todayStr();
    var wasDone = !!h.history[t];
    var before = doneCount();
    if (wasDone) { delete h.history[t]; }
    else { h.history[t] = true; }
    save();
    render();
    if (!wasDone && before < habits.length && doneCount() === habits.length) celebrate();
    checkAchievementsAfterToggle();
  }

  function checkAchievementsAfterToggle() {

    var h = habits.find(function (x) { return x.id === id; });

    habits = habits.filter(function (x) { return x.id !== id; });

  function celebrate() {
    var colors = ['#10B981', '#F59E0B', '#3B82F6', '#EF4444', '#8B5CF6', '#EC4899', '#FBBF24'];
    particles = [];
    for (var i = 0; i < 130; i++) {
      particles.push({
        x: Math.random() * canvas.width,
        y: -20 - Math.random() * canvas.height * 0.4,
        w: 6 + Math.random() * 6, h: 8 + Math.random() * 8,
        vy: 2.5 + Math.random() * 3.5, vx: (Math.random() - 0.5) * 2.4,
        rot: Math.random() * Math.PI, vr: (Math.random() - 0.5) * 0.25,
        color: colors[Math.floor(Math.random() * colors.length)]
      });
    }
    if (rafId) cancelAnimationFrame(rafId);
    (function frame() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      var alive = false;
      particles.forEach(function (p) {
        p.x += p.vx; p.y += p.vy; p.rot += p.vr;
        if (p.y < canvas.height + 30) {
          alive = true;
          ctx.save();
          ctx.translate(p.x, p.y);
          ctx.rotate(p.rot);
          ctx.fillStyle = p.color;
          ctx.globalAlpha = Math.max(0, 1 - (p.y + 30) / (canvas.height + 60));
          ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
          ctx.restore();
        }
      });
      if (alive) { rafId = requestAnimationFrame(frame); }
      else { ctx.clearRect(0, 0, canvas.width, canvas.height); rafId = null; }
    })();
  }

  /* ---------- 主题换肤 ---------- */
  var theme = habits.theme || { mode: 'system', accent: 'green' };
  habits.theme = theme;
  var themeModalEl = document.getElementById('themeModal');

  function resolveMode() {
    if (theme.mode === 'dark') return 'dark';
    if (theme.mode === 'light') return 'light';
    if (typeof matchMedia !== 'undefined' && matchMedia('(prefers-color-scheme: dark)').matches) return 'dark';
    return 'light';
  }

  function applyTheme() {
    var mode = resolveMode();
    document.documentElement.setAttribute('data-theme', mode);
    document.documentElement.setAttribute('data-accent', theme.accent || 'green');
    var meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute('content', mode === 'dark' ? '#111827' : '#10B981');
    document.querySelectorAll('.mode-btn').forEach(function (b) {
      b.classList.toggle('active', b.getAttribute('data-mode') === theme.mode);
    });
    document.querySelectorAll('.swatch').forEach(function (s) {
      s.classList.toggle('active', s.getAttribute('data-accent') === theme.accent);
    });
  }

  document.getElementById('themeBtn').addEventListener('click', function () {
    applyTheme();
    themeModalEl.classList.add('show');
  });
  document.getElementById('themeCancel').addEventListener('click', function () { themeModalEl.classList.remove('show'); });
  document.querySelectorAll('.mode-btn').forEach(function (b) {
    b.addEventListener('click', function () {
      theme.mode = b.getAttribute('data-mode');
      save();
      applyTheme();
    });
  });
  document.querySelectorAll('.swatch').forEach(function (s) {
    s.addEventListener('click', function () {
      theme.accent = s.getAttribute('data-accent');
      save();
      applyTheme();
    });
  });
  if (typeof matchMedia !== 'undefined') {
    matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function () {
      if (theme.mode === 'system') applyTheme();
    });
  }

  /* ---------- 每日提醒 + 安装提示 + Service Worker ---------- */
  var reminder = habits.reminder || { enabled: false, time: '20:00' };
  habits.reminder = reminder;
  var reminderTimer = null;
  var deferredPrompt = null;

  var bellBtn = document.getElementById('bellBtn');
  var bellDot = document.getElementById('bellDot');
  var remindModalEl = document.getElementById('remindModal');
  var remindOnEl = document.getElementById('remindOn');
  var remindTimeEl = document.getElementById('remindTime');

  function updateBell() {
    bellDot.classList.toggle('on', !!reminder.enabled);
  }

  bellBtn.addEventListener('click', function () {
    remindOnEl.checked = !!reminder.enabled;
    remindTimeEl.value = reminder.time || '20:00';
    remindModalEl.classList.add('show');
  });
  document.getElementById('remindCancel').addEventListener('click', function () { remindModalEl.classList.remove('show'); });
  document.getElementById('remindSave').addEventListener('click', function () {
    var wasEnabled = reminder.enabled;
    reminder.enabled = remindOnEl.checked;
    reminder.time = remindTimeEl.value || '20:00';
    save();
    updateBell();
    remindModalEl.classList.remove('show');
    if (reminder.enabled && !wasEnabled && 'Notification' in window && Notification.permission === 'default') {
      try { Notification.requestPermission(); } catch (e) { /* ignore */ }
    }
    scheduleReminder();
    showToast(reminder.enabled ? '🔔 每日提醒已开启（' + reminder.time + '）' : '🔕 提醒已关闭');
  });

  function scheduleReminder() {
    if (reminderTimer) clearTimeout(reminderTimer);
    if (!reminder.enabled) return;
    var now = new Date();
    var p = reminder.time.split(':');
    var target = new Date(now);
    target.setHours(+p[0], +p[1], 0, 0);
    if (target <= now) target.setDate(target.getDate() + 1);
    reminderTimer = setTimeout(fireReminder, target - now);
  }

  function fireReminder() {
    var done = doneCount(), total = habits.length;
    var body = total === 0 ? '先添加一个习惯，开始你的坚持之旅吧 🌱'
      : done < total ? '今天已完成 ' + done + '/' + total + '，还有 ' + (total - done) + ' 个没打卡，加油！'
      : '今天的习惯全部完成，太棒了！🎉';
    if ('Notification' in window && Notification.permission === 'granted') {
      try {
        new Notification('⏰ 习惯打卡', { body: body, icon: 'apple-touch-icon.png', badge: 'icon-192.png' });
      } catch (e) { /* ignore */ }
    }
    if (navigator.vibrate) { try { navigator.vibrate(200); } catch (e) { /* ignore */ } }
    showToast('⏰ ' + body);
    scheduleReminder();
  }

  var toastEl = document.getElementById('toast');
  var toastTimer = null;
  function showToast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.classList.remove('show'); }, 5000);
  }

  /* 安装提示 */
  var installTipEl = document.getElementById('installTip');
  var installModalEl = document.getElementById('installModal');
  var installBtnEl = document.getElementById('installBtn');
  try { if (localStorage.getItem('habit-install-tip-dismissed')) installTipEl.style.display = 'none'; } catch (e) { /* ignore */ }
  document.getElementById('installClose').addEventListener('click', function () {
    installTipEl.style.display = 'none';
    try { localStorage.setItem('habit-install-tip-dismissed', '1'); } catch (e) { /* ignore */ }
  });
  installBtnEl.addEventListener('click', function () {
    if (deferredPrompt) {
      deferredPrompt.prompt();
      deferredPrompt = null;
    } else {
      installModalEl.classList.add('show');
    }
  });
  document.getElementById('installClose2').addEventListener('click', function () { installModalEl.classList.remove('show'); });
  window.addEventListener('beforeinstallprompt', function (e) {
    e.preventDefault();
    deferredPrompt = e;
    installBtnEl.textContent = '安装 App';
  });

  /* Service Worker 注册 */
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js').catch(function () { /* ignore */ });
    });
  }

  scheduleReminder();
  updateBell();

  /* ---------- 启动 ---------- */
  var now = new Date();
  var weekCN = ['日', '一', '二', '三', '四', '五', '六'];
  dateEl.textContent = now.getFullYear() + ' 年 ' + (now.getMonth() + 1) + ' 月 ' + now.getDate() + ' 日 · 周' + weekCN[now.getDay()];
  renderQuote();
  render();
})();
</script>
</body>
</html>
